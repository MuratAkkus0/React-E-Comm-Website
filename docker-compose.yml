services:
  db:
    image: postgres:17-alpine
    container_name: ecomm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecomm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ecomm_db}
    ports:
      - "5434:5432"
    volumes:
      - ecomm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecomm_user} -d ${POSTGRES_DB:-ecomm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecomm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecomm_user}:${POSTGRES_PASSWORD:-ecomm_pass}@db:5432/${POSTGRES_DB:-ecomm_db}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-only-access-secret-change-me-please}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "9000:9000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ecomm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  ecomm-postgres-data:
